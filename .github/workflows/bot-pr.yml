name: Bot PR
on: workflow_dispatch

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Make change
        run: |
          git checkout -b "bot-test-${{ github.run_id }}"
          echo "bot test ${{ github.run_id }}" >> bot.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot.txt
          git commit -m "chore: bot automated test"
          git push origin "bot-test-${{ github.run_id }}"
      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --title "chore: bot automated review target" --body "PR for review metrics" --head "bot-test-${{ github.run_id }}" --base main
