name: Bot PR Generator
on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of PRs to create'
        required: true
        default: '40'

jobs:
  create-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ github.event.inputs.count }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in $(seq 1 $COUNT); do
            BRANCH="review-target-$i"
            git checkout -b "$BRANCH"
            echo "review task $i" >> review_tasks.txt
            git add review_tasks.txt
            git commit -m "chore: automated code review candidate $i"
            git push origin "$BRANCH"

            gh pr create --title "chore: code review item $i" --body "Target for architectural review $i" --head "$BRANCH" --base main
            git checkout main
            sleep 1
          done
